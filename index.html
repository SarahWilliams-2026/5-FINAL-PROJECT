<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Night</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/7948fb7ead.js" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</head>
<body>
    <section id="landing">
        <nav>
            <div class="nav__container">
                <div class="nav__row">
                    <figure class="logo__img__wrapper">
                        <img class="logo" src="./Assets/popcorn__logo.jpg" alt="">
                    </figure>
                    <ul class="nav__links">
                    <li><a href="#" class="nav__link"> Home</a></li>
                    <li><a href="#" class="nav__link"> Find a Movie</a></li>
                    <li><a href="#" class="nav__link nav__link--primary"> Contact</a></li>
                    </ul>
                    <h1>Browse Our Movies</h1>
                    <form action="/search-results" method="GET" role="search">
                        <label for="site-search" class="visually-hidden"></label>
                        <input type="search" id="site-search" name="q" placeholder="Search by genre" required>
                        <button class="search__btn" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </section>
    
</body>
</html>
