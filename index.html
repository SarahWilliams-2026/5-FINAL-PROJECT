<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Night</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/7948fb7ead.js" crossorigin="anonymous"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <section id="landing">
        <header class="navbar">
            <div class="logo">
                <img class="logo" src="./Assets/popcorn__logo.jpg" alt="My Logo">
            </div>
            <nav class="nav__buttons">
                <a href="#home" class="nav__button animated-underline"> Home</a>
                <a href="#movie" class="nav__button animated-underline"> Find a Movie</a>
                <a href="#contact" class="nav__button nav__button--primary"> Contact</a>
            </nav>
        </header>
        <div class="landing__content">
            <h1>Browse Our Movies</h1>
            <form class="input__wrap" action="/search-results" method="GET" role="search">
                <input type="search" id="site-search" name="q" placeholder="Search by genre" required>
                <button class="search__btn" type="submit">
                    <i class="fa fa-search"></i>
                </button>
            </form>
        </div>
    </section>

    <main>
        <section id="searched">
            <div class="loading__bar">
                <div class="loading__bar--first">
                    ::after
                </div>
                <div class="loading__bar--second">
                    ::after
                </div>
                <div class="loading__bar--third">
                    ::after
                </div>
            </div>
            <div id="filter" class="content-wrapper justify-between">
                <h2 class="search--info">
                    <span class="black-text">Search results for</span>
                    <span style="text-transform: capitalize;">"horror"</span>
                </h2>
            </div>
            <div id="movies">
                <div class="content-wrapper">
                    <div class="loading-state">
                        <i class="fas fa-spinner"></i>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div class="container">
    <div class="row">
      <div class="movie-list">
        <div class="movieTitle">
          <div class="movie-card">
            <div class="movie-card__container">
              <h3>Movie Title</h3>
                <p><b>Type:</b> movie</p>
                <p><b>Year:</b> 0000</p>
                <p><b>Cover Art:</b> <a href="https://website.website" target="_blank">website.website</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
    
</body>
</html>
