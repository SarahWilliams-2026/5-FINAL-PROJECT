<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="title__search">
        <a href="/index.html">
            <button>← Back</button>
        </a>
        <div class="title__search--container">
            <label class="title__search--label">
                Search by Title
            </label>
            <input type="number" placeholder="1" onchange="onSearchChange(event)">
        </div>
    </div>
    <div class="title-list">
        <div class="title">
            <img src="#" class="poster__img" alt="">
            <div class="title__name">
                Title
            </div>
            <p class="title__body">
                Plot
            </p>
            <p><b>Year:</b> 0000</p>
            <p><b>Rated:</b> Rated</p>
            <p><b>Genre:</b> Genre</p>
            <p><b>Runtime:</b> 00:00</p>
        </div>
    </div>
</body>
<script src="user.js"></script>
</html>
